services:
  postgres:
    image: postgres:15-alpine
    container_name: best_pr_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-best_pr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_pr_password}
      POSTGRES_DB: ${POSTGRES_DB:-best_pr_system}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-best_pr_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: best_pr_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: best_pr_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-best_pr_user}:${POSTGRES_PASSWORD:-best_pr_password}@postgres:5432/${POSTGRES_DB:-best_pr_system}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor:
        condition: service_started

  tor:
    image: dperson/torproxy
    container_name: best_pr_tor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8118:8118"
      - "127.0.0.1:9050:9050"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: best_pr_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
